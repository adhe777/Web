<html>
<head>
<title>Light blue</title>
</head>
<body>
<h2>Light bulb ON/OFF</h2>
<img id="b" src="images/off.png " style="width:250px; height:250; ">
<br><br>
<button id="btn">
ON/OFF
</button>
<script>
document.getElementById("btn").addEventListener("click", function(){
    var b = document.getElementById("b");
    if (b.src.includes("images/off.png"))
        b.src = "images/on.png";
    else
        b.src="images/off.png";
    });
    
</script>

</body>
</html>
